<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل دخول الآدمن</title>
    <link rel="icon" href="{{ url_for('static', filename='logo2.jpeg') }}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { width: 100%; max-width: 400px; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); background: white; }
    </style>
</head>
<body>
    <center>
        <img src="{{ url_for('static', filename='logo2.jpeg') }}" alt="Logo" class="rounded-circle" style="width: 200px; height: auto;">
    <div class="container d-flex justify-content-center align-items-center">
        <div class="login-card">
            <h3 class="text-center mb-4 fw-bold text-dark">دخول الإدارة ☕</h3>
            
            {% if error %}
                <div class="alert alert-danger text-center" role="alert">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">اسم المستخدم</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">كلمة المرور</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-dark w-100">تسجيل الدخول</button>
            </form>
        </div>
    </div>
    </center>
</body>
</html>
